name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and lint dependencies
        run: python -m pip install pytest PyYAML fastapi httpx ruff
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest
