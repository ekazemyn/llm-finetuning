[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efficient-llm-finetuning"
version = "0.1.0"
description = "Reproducible FinQA fine-tuning and inference benchmarks for Qwen2.5-1.5B-Instruct."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "fastapi>=0.115,<1",
  "mlflow>=2.17,<4",
  "numpy>=1.26,<3",
  "packaging>=24,<27",
  "peft>=0.14,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.4,<3",
  "transformers>=5.19,<6",
  "trl>=1.15,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.45,<1; platform_system == 'Linux'"]
vllm = [
  "nvidia-ml-py>=12,<13; platform_system == 'Linux'",
  "vllm>=0.7,<1; platform_system == 'Linux'",
]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
llm-finetune = "llm_finetuning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
